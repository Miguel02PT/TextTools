  <text x="138" y="313" fill="#647084" font-family="Arial, sans-serif" font-size="16">PROJETO · VERSÃO 1</text>
  <text x="138" y="355" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Revisão de texto para site</text>
  <rect x="138" y="379" width="340" height="2" fill="#E8E1F1"/>
  <circle cx="150" cy="414" r="8" fill="#69558E"/>
  <text x="172" y="421" fill="#172033" font-family="Arial, sans-serif" font-size="17">5 páginas · 1 rodada de ajustes</text>
  <circle cx="150" cy="451" r="8" fill="#3C7450"/>
  <text x="172" y="458" fill="#172033" font-family="Arial, sans-serif" font-size="17">10 dias úteis · preço fixo</text>
  <text x="138" y="493" fill="#69558E" font-family="Arial, sans-serif" font-size="15" font-weight="700">ESCOPO / PRAZO / INVESTIMENTO</text>
