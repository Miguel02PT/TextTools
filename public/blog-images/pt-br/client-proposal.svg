  <text x="78" y="132" fill="#172033" font-family="Arial, sans-serif" font-size="44" font-weight="700">Como escrever uma proposta para cliente</text>
  <text x="80" y="170" fill="#647084" font-family="Arial, sans-serif" font-size="20">Escopo claro. Prazo realista. Preço transparente.</text>
  <rect x="76" y="204" width="540" height="322" rx="24" fill="#FFFFFF"/>
  <text x="112" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">UM PLANO DE TRABALHO</text>
