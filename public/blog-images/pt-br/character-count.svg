<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Como contar caracteres, incluindo espaços</title>
  <desc id="desc">Uma lista visual dos itens que podem entrar na contagem: letras, espaços, pontuação, quebras de linha e emojis.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1090" cy="548" r="170" fill="#E8E1F1"/>
  <circle cx="86" cy="95" r="110" fill="#EAE5F0"/>
  <text x="80" y="86" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  CONTAGEM DE CARACTERES</text>
  <text x="80" y="158" fill="#172033" font-family="Arial, sans-serif" font-size="43" font-weight="700">Como contar caracteres, incluindo espaços</text>
  <text x="80" y="199" fill="#647084" font-family="Arial, sans-serif" font-size="21">Confira o texto exato e a regra do destino.</text>
  <rect x="80" y="252" width="500" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="620" y="252" width="500" height="214" rx="24" fill="#FFFFFF"/>
  <text x="116" y="310" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700">PODEM CONTAR</text>
  <text x="116" y="374" fill="#172033" font-family="Arial, sans-serif" font-size="28" font-weight="700">Letras · espaços · pontuação</text>
  <text x="116" y="420" fill="#647084" font-family="Arial, sans-serif" font-size="21">Quebras de linha · emojis</text>
  <text x="656" y="310" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700">FIQUE DE OLHO</text>
  <text x="656" y="374" fill="#172033" font-family="Arial, sans-serif" font-size="27" font-weight="700">Grafemas e códigos Unicode</text>
  <text x="656" y="420" fill="#647084" font-family="Arial, sans-serif" font-size="21">Plataformas podem contar diferente.</text>
  <text x="80" y="548" fill="#647084" font-family="Arial, sans-serif" font-size="19">Use o contador do destino como referência final para limites rígidos.</text>
</svg>
