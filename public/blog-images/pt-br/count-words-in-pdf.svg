  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">Extraia, confira e conte</text>
  <rect x="80" y="190" width="500" height="245" rx="24" fill="#FFFFFF"/>
  <rect x="620" y="190" width="500" height="245" rx="24" fill="#FFFFFF"/>
  <text x="112" y="235" fill="#647084" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">TEXTO SELECIONÁVEL</text>
  <rect x="112" y="260" width="118" height="154" rx="8" fill="#F4F1F8" stroke="#D9D2E5" stroke-width="2"/>
  <rect x="202" y="260" width="28" height="30" fill="#E8E1F1"/>
  <rect x="132" y="309" width="72" height="5" rx="2.5" fill="#69558E"/>
  <rect x="132" y="331" width="78" height="5" rx="2.5" fill="#69558E"/>
  <rect x="132" y="353" width="60" height="5" rx="2.5" fill="#69558E"/>
  <rect x="132" y="375" width="72" height="5" rx="2.5" fill="#69558E"/>
  <rect x="129" y="305" width="78" height="14" rx="3" fill="#DAD0EE" fill-opacity=".8"/>
  <text x="260" y="306" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Selecione e copie</text>
  <text x="260" y="343" fill="#647084" font-family="Arial, sans-serif" font-size="18">Cole o texto para contar</text>
  <path d="M260 378h236" stroke="#E5E1EB" stroke-width="2"/>
  <text x="260" y="415" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="700">Confira colunas e páginas</text>
  <text x="652" y="235" fill="#647084" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">PÁGINA DIGITALIZADA</text>
  <rect x="684" y="260" width="118" height="154" rx="8" fill="#F4F1F8" stroke="#D9D2E5" stroke-width="2"/>
  <rect x="774" y="260" width="28" height="30" fill="#E8E1F1"/>
  <rect x="704" y="309" width="72" height="5" rx="2.5" fill="#647084"/>
  <rect x="704" y="331" width="78" height="5" rx="2.5" fill="#647084"/>
  <rect x="704" y="353" width="60" height="5" rx="2.5" fill="#647084"/>
  <rect x="704" y="375" width="72" height="5" rx="2.5" fill="#647084"/>
