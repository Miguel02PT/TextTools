<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Como reduzir palavras sem perder o sentido</title>
  <desc id="desc">Uma frase repetitiva é editada para ficar mais curta e manter a ideia principal.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1090" cy="548" r="170" fill="#E8E1F1"/>
  <circle cx="86" cy="95" r="110" fill="#EAE5F0"/>
  <text x="80" y="86" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  EDIÇÃO</text>
  <text x="80" y="158" fill="#172033" font-family="Arial, sans-serif" font-size="43" font-weight="700">Reduza palavras sem perder o sentido</text>
  <text x="80" y="199" fill="#647084" font-family="Arial, sans-serif" font-size="21">Corte repetições; preserve a ideia e as evidências.</text>
  <rect x="80" y="252" width="500" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="620" y="252" width="500" height="214" rx="24" fill="#FFFFFF"/>
  <text x="116" y="310" fill="#A25F56" font-family="Arial, sans-serif" font-size="17" font-weight="700">RASCUNHO</text>
  <text x="116" y="365" fill="#172033" font-family="Arial, sans-serif" font-size="23">Neste momento, a equipe está</text>
  <text x="116" y="405" fill="#172033" font-family="Arial, sans-serif" font-size="23">atualmente revisando o rascunho.</text>
  <text x="656" y="310" fill="#408454" font-family="Arial, sans-serif" font-size="17" font-weight="700">REVISADO</text>
  <text x="656" y="365" fill="#172033" font-family="Arial, sans-serif" font-size="23">A equipe está revisando</text>
  <text x="656" y="405" fill="#172033" font-family="Arial, sans-serif" font-size="23">o rascunho agora.</text>
  <text x="80" y="548" fill="#647084" font-family="Arial, sans-serif" font-size="19">A versão curta ainda precisa preservar a precisão.</text>
</svg>
