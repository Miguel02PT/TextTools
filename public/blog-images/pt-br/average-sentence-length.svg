<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Comprimento médio das frases</title>
  <desc id="desc">Uma amostra de duas frases contém 22 palavras. Ao dividir 22 por 2, a média é de 11 palavras por frase.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  CLAREZA NA ESCRITA</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">Comprimento médio das frases</text>
  <rect x="80" y="190" width="1040" height="170" rx="22" fill="#FFFFFF"/>
  <text x="112" y="233" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">UMA AMOSTRA DE DUAS FRASES</text>
  <text x="112" y="283" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700">Frases curtas ajudam.</text>
  <text x="112" y="323" fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="600">Frases mais longas podem explicar uma ideia complexa, mas detalhes demais em uma só frase podem dificultar a leitura.</text>
  <rect x="80" y="390" width="1040" height="150" rx="22" fill="#E8E1F1"/>
  <text x="112" y="432" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">O CÁLCULO</text>
  <text x="112" y="489" fill="#172033" font-family="Arial, sans-serif" font-size="32" font-weight="700">22 palavras ÷ 2 frases = 11 palavras por frase</text>
  <text x="112" y="520" fill="#493867" font-family="Arial, sans-serif" font-size="17" font-weight="600">Uma pista para editar, não uma meta universal</text>
</svg>
