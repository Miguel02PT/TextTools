<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">统计句子边界</title>
  <desc id="desc">四种会影响句子数量的情况：缩写、小数、换行和句末缺少标点。</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  句子统计</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">统计句子边界</text>
  <rect x="80" y="190" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <rect x="620" y="190" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <rect x="80" y="375" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <rect x="620" y="375" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <text x="112" y="230" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">缩写</text>
  <text x="112" y="278" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">Dr. Li 到了。</text>
  <text x="112" y="319" fill="#8B4538" font-family="Arial, sans-serif" font-size="18" font-weight="600">结合上下文检查</text>
  <text x="652" y="230" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">小数</text>
  <text x="652" y="278" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">数值为 3.5。</text>
  <text x="652" y="319" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="600">小数点不拆分数字</text>
  <text x="112" y="415" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">换行</text>
  <text x="112" y="463" fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">同一句话继续写在下一行</text>
  <text x="112" y="505" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="600">换行不一定表示新句子</text>
  <text x="652" y="415" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">句末没有标点</text>
  <text x="652" y="463" fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">最后一行没有句号</text>
  <text x="652" y="505" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="600">仍可能计为一个句子</text>
</svg>
