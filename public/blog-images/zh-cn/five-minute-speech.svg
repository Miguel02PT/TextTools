<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">五分钟演讲稿需要多少字？</title>
  <desc id="desc">按每分钟 120 至 160 个英文单词计算，五分钟约为 600 至 800 个英文单词。请大声排练，核对实际时长。</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  演讲字数</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">五分钟演讲稿需要多少字？</text>
  <rect x="80" y="190" width="1040" height="156" rx="22" fill="#FFFFFF"/>
  <text x="112" y="238" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">英文演讲规划示例</text>
  <text x="112" y="301" fill="#172033" font-family="Arial, sans-serif" font-size="35" font-weight="700">5 分钟 × 每分钟 120–160 个英文单词</text>
  <rect x="80" y="380" width="500" height="160" rx="22" fill="#E8E1F1"/>
  <rect x="620" y="380" width="500" height="160" rx="22" fill="#E8E1F1"/>
  <text x="112" y="431" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">约</text>
  <text x="112" y="496" fill="#172033" font-family="Arial, sans-serif" font-size="44" font-weight="700">600–800 个英文单词</text>
  <text x="652" y="431" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">然后</text>
  <text x="652" y="483" fill="#172033" font-family="Arial, sans-serif" font-size="29" font-weight="700">大声排练</text>
  <text x="652" y="516" fill="#493867" font-family="Arial, sans-serif" font-size="17" font-weight="600">停顿会影响实际时长</text>
</svg>
