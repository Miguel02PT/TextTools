<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">在 Excel 中统计字符数</title>
  <desc id="desc">使用 LEN 统计单元格字符，或将多个单元格的字符数相加，空格也会计入。</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" letter-spacing="2">TEXTTOOOLS  /  字符统计</text>
  <text x="80" y="145" fill="#172033" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700">在 Excel 中统计字符数</text>
  <rect x="80" y="190" width="500" height="190" rx="22" fill="#FFFFFF"/>
  <rect x="620" y="190" width="500" height="190" rx="22" fill="#FFFFFF"/>
  <text x="112" y="238" fill="#69558E" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">单个单元格</text>
  <text x="112" y="298" fill="#172033" font-family="Arial, sans-serif" font-size="38" font-weight="700">=LEN(A1)</text>
  <text x="112" y="342" fill="#493867" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600">空格和标点也计入</text>
  <text x="652" y="238" fill="#69558E" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">多个单元格合计</text>
  <text x="652" y="298" fill="#172033" font-family="Arial, sans-serif" font-size="38" font-weight="700">=SUM(LEN(A1),LEN(A2))</text>
  <text x="652" y="342" fill="#493867" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600">将所需字符数相加</text>
  <rect x="80" y="415" width="1040" height="125" rx="22" fill="#E8E1F1"/>
  <text x="112" y="460" fill="#69558E" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">示例结果</text>
  <text x="112" y="510" fill="#172033" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">“The quick brown fox.” = 20 个字符</text>
</svg>
