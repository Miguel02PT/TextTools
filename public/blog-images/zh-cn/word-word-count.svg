<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">在 Microsoft Word 中查看字数</title>
  <desc id="desc">Word 显示文档共 1,247 个词，选中的文字为 82 个词。</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  字数统计</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, Microsoft YaHei, sans-serif" font-size="40" font-weight="700">在 Microsoft Word 中统计字数</text>
  <rect x="80" y="190" width="500" height="190" rx="22" fill="#FFFFFF"/>
  <rect x="620" y="190" width="500" height="190" rx="22" fill="#FFFFFF"/>
  <text x="112" y="238" fill="#69558E" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">整篇文档</text>
  <text x="112" y="298" fill="#172033" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">1,247 个词</text>
  <text x="112" y="342" fill="#493867" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="600">查看文档总字数</text>
  <text x="652" y="238" fill="#69558E" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">选中内容</text>
  <text x="652" y="298" fill="#172033" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">82 个词</text>
  <text x="652" y="342" fill="#493867" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="600">选中文字查看统计</text>
  <rect x="80" y="415" width="1040" height="125" rx="22" fill="#E8E1F1"/>
  <text x="112" y="460" fill="#69558E" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">确认统计范围</text>
  <text x="112" y="510" fill="#172033" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">同一份文档可能显示不同的统计结果。</text>
</svg>
