<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Mensaje de ausencia: fechas claras y una respuesta útil</title>
  <desc id="desc">Una respuesta automática indica la fecha de regreso, un contacto para urgencias y cuándo habrá respuesta.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1095" cy="82" r="152" fill="#E8E1F1"/>
  <circle cx="86" cy="574" r="150" fill="#EAE5F0"/>
  <text x="80" y="66" fill="#69558E" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MENSAJE DE AUSENCIA</text>
  <text x="78" y="132" fill="#172033" font-family="Arial, sans-serif" font-size="42" font-weight="700">Una respuesta útil mientras no estás</text>
  <text x="80" y="170" fill="#647084" font-family="Arial, sans-serif" font-size="20">Fechas claras. El contacto adecuado. Sin datos personales de más.</text>
  <rect x="76" y="204" width="540" height="322" rx="24" fill="#FFFFFF"/>
  <text x="112" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">RESPUESTA AUTOMÁTICA</text>
  <rect x="108" y="270" width="476" height="216" rx="18" fill="#F7F5FA"/>
  <text x="138" y="315" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Gracias por tu mensaje.</text>
  <text x="138" y="350" fill="#647084" font-family="Arial, sans-serif" font-size="18">Estaré fuera hasta el [fecha].</text>
  <rect x="138" y="372" width="414" height="1" fill="#E1DDE7"/>
  <text x="138" y="410" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">¿ES URGENTE? CONTACTA CON</text>
  <text x="138" y="447" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">[Persona o equipo] · [contacto]</text>
  <text x="138" y="472" fill="#647084" font-family="Arial, sans-serif" font-size="16">Responderé al resto al volver.</text>
  <rect x="652" y="204" width="472" height="322" rx="24" fill="#FFFFFF"/>
  <text x="688" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">UNA RESPUESTA ÚTIL INCLUYE</text>
  <circle cx="704" cy="300" r="13" fill="#E5F0E7"/>
  <path d="M698 300L703 305L711 295" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="307" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Cuándo vuelves</text>
  <circle cx="704" cy="360" r="13" fill="#E5F0E7"/>
  <path d="M698 360L703 365L711 355" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="367" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Quién puede ayudar antes</text>
  <circle cx="704" cy="420" r="13" fill="#E5F0E7"/>
  <path d="M698 420L703 425L711 415" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="427" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Qué puede esperar</text>
  <rect x="688" y="459" width="392" height="40" rx="20" fill="#F0EEF8"/>
  <text x="708" y="485" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">COMPARTE SOLO LO NECESARIO</text>
  <text x="80" y="578" fill="#647084" font-family="Arial, sans-serif" font-size="20">FECHAS / COBERTURA / PRIVACIDAD</text>
</svg>
