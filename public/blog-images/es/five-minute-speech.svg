<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">¿Cuántas palabras tiene un discurso de cinco minutos?</title>
  <desc id="desc">A 120–160 palabras por minuto, un discurso de cinco minutos tiene unas 600–800 palabras. Ensaya en voz alta para comprobar el tiempo real.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  RECUENTO PARA DISCURSOS</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">¿Cuántas palabras en 5 minutos?</text>
  <rect x="80" y="190" width="1040" height="156" rx="22" fill="#FFFFFF"/>
  <text x="112" y="238" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">EJEMPLO DE PLANIFICACIÓN</text>
  <text x="112" y="301" fill="#172033" font-family="Arial, sans-serif" font-size="35" font-weight="700">5 min × 120–160 palabras por minuto</text>
  <rect x="80" y="380" width="500" height="160" rx="22" fill="#E8E1F1"/>
  <rect x="620" y="380" width="500" height="160" rx="22" fill="#E8E1F1"/>
  <text x="112" y="431" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">APROXIMADAMENTE</text>
  <text x="112" y="496" fill="#172033" font-family="Arial, sans-serif" font-size="44" font-weight="700">600–800 palabras</text>
  <text x="652" y="431" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">DESPUÉS</text>
  <text x="652" y="483" fill="#172033" font-family="Arial, sans-serif" font-size="29" font-weight="700">Ensaya en voz alta</text>
  <text x="652" y="516" fill="#493867" font-family="Arial, sans-serif" font-size="17" font-weight="600">Las pausas cambian el tiempo</text>
</svg>
