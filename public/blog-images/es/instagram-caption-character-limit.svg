<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Límite de caracteres en Instagram</title>
  <desc id="desc">Un borrador de Instagram se comprueba frente al límite de 2.200 caracteres documentado para la API de publicación de Meta.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1070" cy="68" r="152" fill="#E8E1F1"/>
  <circle cx="148" cy="610" r="138" fill="#EAE5F0"/>
  <text x="80" y="78" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  CONTADOR DE CARACTERES</text>
  <text x="80" y="150" fill="#172033" font-family="Arial, sans-serif" font-size="42" font-weight="700">Límite de caracteres en Instagram</text>
  <rect x="80" y="186" width="1040" height="222" rx="24" fill="#FFFFFF"/>
  <text x="116" y="232" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">UNA COMPROBACIÓN, NO UNA META</text>
  <text x="116" y="282" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700">Haz clara la primera línea.</text>
  <text x="116" y="322" fill="#172033" font-family="Arial, sans-serif" font-size="19" font-weight="500">Cuenta todo el texto y confírmalo en tu editor.</text>
  <rect x="116" y="350" width="968" height="14" rx="7" fill="#E8E1F1"/>
  <rect x="116" y="350" width="746" height="14" rx="7" fill="#8068A8"/>
  <rect x="80" y="430" width="1040" height="124" rx="22" fill="#E8E1F1"/>
  <text x="116" y="474" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">DOCUMENTACIÓN DE LA API DE META</text>
  <text x="116" y="522" fill="#172033" font-family="Arial, sans-serif" font-size="31" font-weight="700">2.200 caracteres  ·  revisa el editor final</text>
</svg>
