<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cuenta las palabras de un correo antes de enviarlo</title>
  <desc id="desc">Un borrador de correo se revisa con el contador adecuado antes de enviarlo.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1090" cy="548" r="170" fill="#E8E1F1"/>
  <circle cx="86" cy="95" r="110" fill="#EAE5F0"/>
  <text x="80" y="86" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  ESCRITURA DE CORREOS</text>
  <text x="80" y="158" fill="#172033" font-family="Arial, sans-serif" font-size="42" font-weight="700">Cuenta las palabras antes de enviar.</text>
  <text x="80" y="199" fill="#647084" font-family="Arial, sans-serif" font-size="21">Cuenta solo el texto incluido en el límite.</text>
  <rect x="80" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="440" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
