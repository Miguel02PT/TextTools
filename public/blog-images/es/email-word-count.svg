  <text x="116" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">01  /  BORRADOR</text>
  <text x="476" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">02  /  RECUENTO</text>
  <text x="836" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">03  /  REVISIÓN</text>
  <text x="116" y="356" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Cuerpo del correo</text>
  <text x="476" y="356" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Cuenta las palabras</text>
  <text x="836" y="356" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Listo para enviar</text>
  <rect x="116" y="384" width="224" height="12" rx="6" fill="#E8E5EE"/>
