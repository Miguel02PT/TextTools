  <text x="110" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ESTE PERIODO</text>
  <circle cx="124" cy="293" r="12" fill="#E5F0E7"/>
