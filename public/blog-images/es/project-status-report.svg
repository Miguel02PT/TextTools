  <text x="152" y="329" fill="#647084" font-family="Arial, sans-serif" font-size="17">Hito completado · 10 nov</text>
  <rect x="110" y="354" width="424" height="1" fill="#E8E1F1"/>
  <text x="110" y="394" fill="#69558E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">PRÓXIMO HITO</text>
  <text x="110" y="434" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Lanzamiento piloto · 14 nov</text>
  <text x="110" y="476" fill="#647084" font-family="Arial, sans-serif" font-size="17">Responsable: Morgan</text>
  <rect x="604" y="204" width="520" height="322" rx="24" fill="#FFFFFF"/>
