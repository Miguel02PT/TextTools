  <text x="656" y="293" fill="#9A5A18" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">EN RIESGO</text>
  <text x="640" y="350" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Retraso del proveedor</text>
  <text x="640" y="381" fill="#647084" font-family="Arial, sans-serif" font-size="17">Morgan · confirmar fecha el mié.</text>
  <rect x="640" y="415" width="448" height="74" rx="16" fill="#F0EEF8"/>
  <text x="664" y="446" fill="#69558E" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">DECISIÓN PENDIENTE</text>
  <text x="664" y="472" fill="#172033" font-family="Arial, sans-serif" font-size="18" font-weight="700">Aprobar un día adicional de margen</text>
  <text x="80" y="578" fill="#647084" font-family="Arial, sans-serif" font-size="20">AVANCES / RIESGOS / RESPONSABLES / PASOS</text>
