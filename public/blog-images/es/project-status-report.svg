  <text x="78" y="132" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">Actualizaciones que impulsan el trabajo</text>
  <text x="80" y="170" fill="#647084" font-family="Arial, sans-serif" font-size="20">Avances, riesgos y próximos pasos en una sola vista.</text>
