<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cuenta los límites entre oraciones</title>
  <desc id="desc">Cuatro casos que pueden afectar al recuento: abreviaturas, decimales, saltos de línea y falta de puntuación final.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  RECUENTO DE ORACIONES</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">Cuenta los límites entre oraciones</text>
  <rect x="80" y="190" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <rect x="620" y="190" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <rect x="80" y="375" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <rect x="620" y="375" width="500" height="165" rx="22" fill="#FFFFFF"/>
  <text x="112" y="230" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ABREVIATURAS</text>
  <text x="112" y="278" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">El Sr. Ruiz llegó.</text>
  <text x="112" y="319" fill="#8B4538" font-family="Arial, sans-serif" font-size="18" font-weight="600">Revisa el contexto</text>
  <text x="652" y="230" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">DECIMALES</text>
  <text x="652" y="278" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">El valor es 3,5.</text>
  <text x="652" y="319" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="600">Mantén unido el número</text>
  <text x="112" y="415" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SALTOS DE LÍNEA</text>
  <text x="112" y="463" fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">La misma idea continúa</text>
  <text x="112" y="505" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="600">Una línea nueva no siempre inicia otra oración</text>
  <text x="652" y="415" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SIN PUNTUACIÓN FINAL</text>
  <text x="652" y="463" fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">La nota final no tiene punto</text>
  <text x="652" y="505" fill="#493867" font-family="Arial, sans-serif" font-size="18" font-weight="600">Aun así, puede contar como una oración</text>
</svg>
