<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">¿Cuánto se tarda en leer 1.000 palabras?</title>
  <desc id="desc">Estimación en tres pasos: contar 1.000 palabras, dividir entre 200 palabras por minuto y calcular unos cinco minutos.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1090" cy="548" r="170" fill="#E8E1F1"/>
  <circle cx="86" cy="95" r="110" fill="#EAE5F0"/>
  <text x="80" y="86" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  GUÍA DE LECTURA</text>
  <text x="80" y="158" fill="#172033" font-family="Arial, sans-serif" font-size="42" font-weight="700">¿Cuánto se tarda en leer 1.000 palabras?</text>
  <text x="80" y="199" fill="#647084" font-family="Arial, sans-serif" font-size="21">Una estimación útil depende del texto y de tu ritmo.</text>
  <rect x="80" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="440" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="800" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <circle cx="122" cy="298" r="18" fill="#EEE9F3"/>
  <circle cx="482" cy="298" r="18" fill="#EEE9F3"/>
  <circle cx="842" cy="298" r="18" fill="#EEE9F3"/>
  <text x="113" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">01</text>
  <text x="473" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">02</text>
  <text x="833" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">03</text>
  <text x="116" y="365" fill="#172033" font-family="Arial, sans-serif" font-size="28" font-weight="700">1.000 palabras</text>
  <text x="476" y="365" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700">÷ 200 palabras/min</text>
  <text x="836" y="365" fill="#172033" font-family="Arial, sans-serif" font-size="28" font-weight="700">≈ 5 minutos</text>
  <text x="116" y="405" fill="#647084" font-family="Arial, sans-serif" font-size="17">Cuenta el texto.</text>
  <text x="476" y="405" fill="#647084" font-family="Arial, sans-serif" font-size="17">Elige una velocidad.</text>
  <text x="836" y="405" fill="#647084" font-family="Arial, sans-serif" font-size="17">Es solo una estimación.</text>
  <path d="M408 359H427" stroke="#69558E" stroke-width="4" stroke-linecap="round"/>
  <path d="M419 351L427 359L419 367" stroke="#69558E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M768 359H787" stroke="#69558E" stroke-width="4" stroke-linecap="round"/>
  <path d="M779 351L787 359L779 367" stroke="#69558E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="548" fill="#647084" font-family="Arial, sans-serif" font-size="18">El tiempo real depende de la persona, el idioma y el contenido.</text>
</svg>
