<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How to write a professional bio</title>
  <desc id="desc">A profile bio introduces a person's role, relevant experience, current focus, and a clear next step.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1095" cy="82" r="152" fill="#E8E1F1"/>
  <circle cx="86" cy="574" r="150" fill="#EAE5F0"/>
  <text x="80" y="66" fill="#69558E" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CLEAR PROFESSIONAL WRITING</text>
  <text x="78" y="132" fill="#172033" font-family="Arial, sans-serif" font-size="46" font-weight="700">How to write a professional bio</text>
  <text x="80" y="170" fill="#647084" font-family="Arial, sans-serif" font-size="20">A focused introduction, not a full career history.</text>
  <rect x="76" y="204" width="540" height="322" rx="24" fill="#FFFFFF"/>
  <text x="112" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">A SHORT PROFILE</text>
  <rect x="108" y="270" width="476" height="216" rx="18" fill="#F7F5FA"/>
  <circle cx="151" cy="325" r="23" fill="#E8E1F1"/>
  <circle cx="151" cy="318" r="8" fill="#69558E"/>
  <path d="M135 340C137 328 165 328 167 340" stroke="#69558E" stroke-width="5" stroke-linecap="round"/>
  <text x="190" y="318" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Jordan Lee</text>
  <text x="190" y="347" fill="#647084" font-family="Arial, sans-serif" font-size="17">Product designer</text>
  <text x="138" y="393" fill="#172033" font-family="Arial, sans-serif" font-size="17">Helps healthcare teams improve</text>
  <text x="138" y="421" fill="#172033" font-family="Arial, sans-serif" font-size="17">everyday digital experiences.</text>
  <text x="138" y="462" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">See selected work →</text>
  <rect x="652" y="204" width="472" height="322" rx="24" fill="#FFFFFF"/>
  <text x="688" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">A BIO THAT WORKS</text>
  <circle cx="704" cy="310" r="13" fill="#E5F0E7"/>
  <path d="M698 310L703 315L711 305" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="317" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">A clear role</text>
  <circle cx="704" cy="370" r="13" fill="#E5F0E7"/>
  <path d="M698 370L703 375L711 365" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="377" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Relevant evidence</text>
  <circle cx="704" cy="430" r="13" fill="#E5F0E7"/>
  <path d="M698 430L703 435L711 425" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="437" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">One next step</text>
  <rect x="688" y="469" width="392" height="40" rx="20" fill="#F0EEF8"/>
  <text x="708" y="495" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">SPECIFIC / ACCURATE / CURRENT</text>
  <text x="80" y="578" fill="#647084" font-family="Arial, sans-serif" font-size="20">ROLE / EVIDENCE / CONNECTION</text>
</svg>
