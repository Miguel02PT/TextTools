  <text x="80" y="158" fill="#172033" font-family="Arial, sans-serif" font-size="46" font-weight="700">Find &amp; replace without surprises.</text>
  <text x="80" y="199" fill="#647084" font-family="Arial, sans-serif" font-size="21">A safer workflow for changes across a document.</text>
  <rect x="80" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="440" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <rect x="800" y="252" width="320" height="214" rx="24" fill="#FFFFFF"/>
  <circle cx="122" cy="298" r="18" fill="#EEE9F3"/>
  <circle cx="482" cy="298" r="18" fill="#EEE9F3"/>
  <circle cx="842" cy="298" r="18" fill="#EEE9F3"/>
  <text x="113" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">01</text>
  <text x="473" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">02</text>
  <text x="833" y="305" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">03</text>
  <text x="116" y="351" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Find</text>
  <text x="476" y="351" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Replace</text>
  <text x="836" y="351" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Review</text>
  <text x="116" y="391" fill="#647084" font-family="Arial, sans-serif" font-size="22">draft</text>
  <text x="476" y="391" fill="#647084" font-family="Arial, sans-serif" font-size="22">final</text>
  <text x="836" y="391" fill="#647084" font-family="Arial, sans-serif" font-size="22">3 matches</text>
