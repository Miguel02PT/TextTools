<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Average sentence length</title>
  <desc id="desc">A two-sentence sample contains 21 words. Divide 21 words by 2 sentences to get an average of 10.5 words per sentence.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1060" cy="70" r="150" fill="#E8E1F1"/>
  <circle cx="145" cy="610" r="140" fill="#EAE5F0"/>
  <text x="80" y="82" fill="#69558E" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEXTTOOOLS  /  WRITING CLARITY</text>
  <text x="80" y="145" fill="#172033" font-family="Arial, sans-serif" font-size="40" font-weight="700">Average sentence length</text>
  <rect x="80" y="190" width="1040" height="170" rx="22" fill="#FFFFFF"/>
  <text x="112" y="233" fill="#647084" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">A TWO-SENTENCE SAMPLE</text>
  <text x="112" y="283" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700">Short sentences help.</text>
  <text x="112" y="323" fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="600">Longer sentences can explain a complex idea, but too many details in one sentence may slow readers down.</text>
  <rect x="80" y="390" width="1040" height="150" rx="22" fill="#E8E1F1"/>
  <text x="112" y="432" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">THE CALCULATION</text>
  <text x="112" y="489" fill="#172033" font-family="Arial, sans-serif" font-size="32" font-weight="700">21 words ÷ 2 sentences = 10.5 words per sentence</text>
  <text x="112" y="520" fill="#493867" font-family="Arial, sans-serif" font-size="17" font-weight="600">A useful editing clue, not a universal target</text>
</svg>
