<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How to write a client proposal</title>
  <desc id="desc">A clear proposal connects a client's need with defined work, a schedule, and a transparent price.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F1F8"/>
  <circle cx="1095" cy="82" r="152" fill="#E8E1F1"/>
  <circle cx="86" cy="574" r="150" fill="#EAE5F0"/>
  <text x="80" y="66" fill="#69558E" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CLEAR CLIENT COMMUNICATION</text>
  <text x="78" y="132" fill="#172033" font-family="Arial, sans-serif" font-size="46" font-weight="700">How to write a client proposal</text>
  <text x="80" y="170" fill="#647084" font-family="Arial, sans-serif" font-size="20">Clear scope. Realistic timing. Transparent pricing.</text>
  <rect x="76" y="204" width="540" height="322" rx="24" fill="#FFFFFF"/>
  <text x="112" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">A PROJECT OUTLINE</text>
  <rect x="108" y="270" width="476" height="236" rx="18" fill="#F7F5FA"/>
  <text x="138" y="313" fill="#647084" font-family="Arial, sans-serif" font-size="16">CLIENT PROJECT · VERSION 1</text>
  <text x="138" y="355" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Website copy review</text>
  <rect x="138" y="379" width="340" height="2" fill="#E8E1F1"/>
  <circle cx="150" cy="414" r="8" fill="#69558E"/>
  <text x="172" y="421" fill="#172033" font-family="Arial, sans-serif" font-size="17">5 pages · 1 revision round</text>
  <circle cx="150" cy="451" r="8" fill="#3C7450"/>
  <text x="172" y="458" fill="#172033" font-family="Arial, sans-serif" font-size="17">10 working days · fixed fee</text>
  <text x="138" y="493" fill="#69558E" font-family="Arial, sans-serif" font-size="15" font-weight="700">SCOPE / TIMELINE / INVESTMENT</text>
  <rect x="652" y="204" width="472" height="322" rx="24" fill="#FFFFFF"/>
  <text x="688" y="250" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">A PROPOSAL THAT HELPS</text>
  <circle cx="704" cy="310" r="13" fill="#E5F0E7"/>
  <path d="M698 310L703 315L711 305" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="317" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Defined deliverables</text>
  <circle cx="704" cy="370" r="13" fill="#E5F0E7"/>
  <path d="M698 370L703 375L711 365" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="377" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Visible assumptions</text>
  <circle cx="704" cy="430" r="13" fill="#E5F0E7"/>
  <path d="M698 430L703 435L711 425" stroke="#3C7450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="732" y="437" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">A clear next step</text>
  <rect x="688" y="469" width="392" height="40" rx="20" fill="#F0EEF8"/>
  <text x="708" y="495" fill="#69558E" font-family="Arial, sans-serif" font-size="16" font-weight="700">SPECIFIC / REALISTIC / EASY TO REVIEW</text>
  <text x="80" y="578" fill="#647084" font-family="Arial, sans-serif" font-size="20">NEED / SCOPE / PRICE / DECISION</text>
