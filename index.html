<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TextToools is a fast, private, browser-based collection of simple text utilities for counting, cleaning, formatting, and analyzing text."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      ;(() => {
        const storageKey = 'texttools-theme'
        let preference = 'light'

        function applyTheme() {
          const isDark = preference === 'dark'
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          window.dispatchEvent(new Event('texttools-theme-change'))
        }

        try {
          const storedPreference = window.localStorage.getItem(storageKey)
          preference =
            storedPreference === 'dark' || storedPreference === 'light'
              ? storedPreference
              : 'light'
        } catch (error) {
          console.error('Unable to read the theme preference.', error)
        }

        applyTheme()

        window.addEventListener('storage', (event) => {
          if (event.key !== storageKey) return
          preference =
            event.newValue === 'dark' || event.newValue === 'light'
              ? event.newValue
              : 'light'
          applyTheme()
        })
      })()
    </script>
    <title>TextToools | Simple tools for working with text.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
